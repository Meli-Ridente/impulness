# Desarrollo con recarga en vivo:  docker compose up   →  http://localhost:5173
services:
  web:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host"
volumes:
  node_modules:
